name: Refresh README stats cache-buster

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README stats version
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import sys
          import time
          from pathlib import Path

          try:
              readme = Path("README.md")
              if not readme.exists():
                  raise FileNotFoundError("README.md not found in repository root")

              content = readme.read_text(encoding="utf-8")
              stamp = str(int(time.time()))
              updated = re.sub(r'([?&]v=)\d*', rf'\1{stamp}', content)

              if updated != content:
                  readme.write_text(updated, encoding="utf-8")
          except Exception as exc:
              print(f"Failed to update README stats version: {exc}", file=sys.stderr)
              raise
          PY

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh README stats cache-buster"
          if ! git push; then
            echo "Failed to push README refresh commit." >&2
            exit 1
          fi
